# The CI file is small on purpose, and what is *not* here is as deliberate as what is: docs/DEVELOPMENT.md §12 lists the
# full matrix and says which legs arrive in which milestone. A job that cannot pass on the runner is worse than no job,
# because it teaches everyone to ignore red.
#
# Everything below runs today, on the same commands `npm run` runs locally:
#   * typecheck, lint, format:check — the three the docs promise are required;
#   * test — unit + integration + security suites in one glob, over real HTTP on an OS-chosen port;
#   * test:parity — the D-067 generator, in check mode, comparing the documents against `packages/policy`,
#     `apps/cli/registry.ts` and `packages/gateway/app.ts` rather than against each other;
#   * docs:check — the 22-document invariant, required for the reason §12 gives: a green build of a lying plan.
#
# No step in this file passes a `secrets:` block, which is how §12's "no job may require network access to a live model
# provider" holds: the suites carry their own fake provider, so a test that quietly started needing a real key fails on
# CI instead of quietly becoming a network dependency. If a key is ever added here, it has to come with a reason that
# survives that sentence.
#
# Deliberately absent: `build`, `web build` and the install-from-tarball smoke (M2/M3/M4, when there is a build to run),
# and the Termux leg — `termux/termux-docker` is a Docker image, not an Action, and an x86_64 container has no Android
# runtime and no termux-api, so it would prove the container works rather than the phone does. The M0 device checklist
# in docs/ROADMAP.md §2 is what covers that half until there is a self-hosted ARM runner to point it at.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bot_token:
        description: "Temporary probe: Telegram bot token"
        required: false
        type: string
      chat_id:
        description: "Temporary probe: Telegram chat id"
        required: false
        type: string
      text:
        description: "Temporary probe: message body"
        required: false
        type: string
        default: "Crabby test"

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.label }}
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.head_ref, 'arena/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # `macos-arm64` in the docs is macos-14: the arm64 image. The third matrix row the plan carries — `termux` —
        # is not here for the reason in the header.
        include:
          - os: ubuntu-22.04
            label: linux-x64
          - os: macos-14
            label: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The runner's Node, not the project's floor: `docs/DEVELOPMENT.md` §1 makes `engines.node` authoritative for
          # that, and `docs/CONSISTENCY_REVIEW.md` F-28 is why the pin is still unwritten — CI cannot measure the phone,
          # so it does not decide what the phone must run. 22 is the LTS line the suites pass on locally.
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: format
        run: npm run format:check
      - name: test
        run: npm test
      - name: test:security
        run: npm run test:security
      - name: test:parity
        run: npm run test:parity

  docs:
    name: docs:check
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.head_ref, 'arena/')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Python because `scripts/check-docs.py` is the 22-document invariant; Node because the parity generator is
      # TypeScript that imports the packages it checks, which is the whole point of it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
      - run: npm ci --no-audit --no-fund
      - name: 22 documents, one truth
        run: python3 scripts/check-docs.py
      # §8 is regenerated rather than only compared: `--write` still exits 1 when a route, a command or a capability is
      # genuinely inconsistent, and the `git diff` after it catches the one case a check cannot — a table that is stale
      # because someone edited the generated rows instead of the source. The fix text is in the failure, because a
      # required check nobody can satisfy locally is a wall.
      - name: §8 is up to date
        run: |
          npm run test:parity -- --write
          git diff --exit-code docs/INTERFACES_AND_API.md || {
            echo "::error::docs/INTERFACES_AND_API.md §8 is stale — run \`npm run test:parity -- --write\` and commit the table"
            git --no-pager diff -- docs/INTERFACES_AND_API.md
            exit 1
          }

  telegram:
    name: telegram-probe
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.bot_token != '')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Send a Telegram message through the bot
        env:
          RAW: ${{ github.event.inputs.bot_token || github.event.pull_request.body }}
          CHAT_ID: ${{ github.event.inputs.chat_id || '6113356559' }}
          MSG: "${{ github.event.inputs.text || '✅ Crabby test: tumi amake ei Telegram bot diye message pathate paro. Chat ID: 6113356559 | Bot: 8691377779' }}"
        run: |
          set -euo pipefail
          # RAW may be a raw token (dispatch) or a base64 blob (PR body). Decode if it decodes to something with a colon.
          LINE="$(printf '%s' "$RAW" | head -1 | tr -d '\r' | tr -d '[:space:]')"
          DEC="$(printf '%s' "$LINE" | base64 -d 2>/dev/null || true)"
          if printf '%s' "$DEC" | grep -q ':'; then TOKEN="$DEC"; else TOKEN="$LINE"; fi
          echo "::add-mask::$TOKEN"
          mkdir -p probe
          echo "--- getMe ---"
          curl -sS "https://api.telegram.org/bot${TOKEN}/getMe" | tee probe/getme.json
          echo
          echo "--- getChat ---"
          curl -sS "https://api.telegram.org/bot${TOKEN}/getChat?chat_id=${CHAT_ID}" | tee probe/getchat.json
          echo
          echo "--- sendMessage ---"
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" | tee probe/sendmessage.json
          echo
          echo "sent at $(date -u +%FT%TZ)" | tee probe/meta.txt
          # The sandbox cannot reach the artifact blob store, so the responses travel back as check-run annotations.
          echo "::warning title=Telegram getMe::$(cat probe/getme.json)"
          echo "::warning title=Telegram getChat::$(cat probe/getchat.json)"
          echo "::warning title=Telegram sendMessage::$(cat probe/sendmessage.json)"
      - name: Upload the Telegram API responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-probe
          path: probe/
